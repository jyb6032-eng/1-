<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 반 만능 놀이터</title>
    <!-- 리액트와 테일윈드 CSS를 불러옵니다 (인터넷 연결 필요) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 1학년 아이들을 위한 예쁜 폰트와 스타일 */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif; /* 동글동글한 폰트 적용 */
        }
        
        .notebook-line {
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 40px;
            margin-top: 40px;
        }
        
        /* 스크롤바 꾸미기 */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #fcd34d;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #fbbf24;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 컴포넌트들 (직접 그림) ---
        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconPicker = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>; 
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconShuffle = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l14.2-9.4c.8-1.1 2-1.7 3.3-1.7H22"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l14.2 9.4c.8 1.1 2 1.7 3.3 1.7H22"/></svg>;
        const IconMap = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></svg>;
        const IconPalette = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>;
        const IconNote = () => <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>;
        const IconArrowUp = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>;
        const IconArrowDown = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>;
        const IconArrowLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const IconArrowRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const IconSave = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const IconEraser = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;


        // --- 1. 발표 왕 뽑기 ---
        const RandomPicker = ({ names, setNames }) => {
            const [winner, setWinner] = useState(null);
            const [isRolling, setIsRolling] = useState(false);

            const handlePick = () => {
                const nameList = names.split(',').map(n => n.trim()).filter(n => n !== "");
                if (nameList.length === 0) return;

                setIsRolling(true);
                setWinner(null);
                
                let count = 0;
                const interval = setInterval(() => {
                    setWinner(nameList[Math.floor(Math.random() * nameList.length)]);
                    count++;
                    if (count > 15) {
                        clearInterval(interval);
                        setIsRolling(false);
                    }
                }, 100);
            };

            return (
                <div className="flex flex-col items-center justify-center h-full p-4 bg-yellow-50 overflow-y-auto">
                    <h2 className="text-3xl font-bold mb-6 text-orange-600 shrink-0">🎲 두근두근 발표 왕은?</h2>
                    <div className="bg-white p-8 rounded-3xl shadow-xl border-4 border-orange-200 w-full max-w-md text-center min-h-[200px] flex items-center justify-center mb-6 shrink-0">
                        {winner ? (
                            <span className={`text-5xl font-black ${isRolling ? 'text-gray-400' : 'text-blue-600 animate-bounce'}`}>
                                {winner}
                            </span>
                        ) : (
                            <span className="text-gray-400 text-xl">버튼을 눌러보세요!</span>
                        )}
                    </div>
                    <button onClick={handlePick} disabled={isRolling} className="bg-orange-500 hover:bg-orange-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transform transition active:scale-95 disabled:opacity-50 mb-8 shrink-0">
                        {isRolling ? "뽑는 중..." : "발표 왕 뽑기!"}
                    </button>
                    <div className="w-full max-w-md shrink-0">
                        <label className="block text-sm font-medium text-gray-700 mb-2">친구들 이름 (쉼표로 구분해요)</label>
                        <textarea value={names} onChange={(e) => setNames(e.target.value)} className="w-full p-3 border-2 border-orange-200 rounded-xl focus:outline-none focus:border-orange-400" rows="3" placeholder="예: 김철수, 이영희, 박민준..."></textarea>
                        <p className="text-xs text-gray-500 mt-2 text-center">💡 다른 놀이를 하고 와도 이름이 지워지지 않아요!</p>
                    </div>
                </div>
            );
        };

        // --- 2. 시계 놀이 ---
        const ClockApp = () => {
            const [minutes, setMinutes] = useState(180);
            const hourRotation = (minutes / 60) * 30;
            const minuteRotation = (minutes % 60) * 6;
            const formatTime = (totalMin) => {
                let h = Math.floor(totalMin / 60);
                const m = totalMin % 60;
                if (h === 0) h = 12;
                if (h > 12) h -= 12;
                return `${h}시 ${m.toString().padStart(2, '0')}분`;
            };

            return (
                <div className="flex flex-col items-center justify-center h-full bg-blue-50 p-4 overflow-y-auto">
                    <h2 className="text-3xl font-bold mb-4 text-blue-600 shrink-0">⏰ 시계야 놀자!</h2>
                    <div className="relative w-[300px] h-[300px] sm:w-[350px] sm:h-[350px] bg-white rounded-full border-8 border-blue-400 shadow-2xl flex items-center justify-center mb-6 shrink-0 aspect-square">
                        {[...Array(12)].map((_, i) => (
                            <div key={i} className="absolute font-bold text-2xl text-gray-600" style={{ transform: `rotate(${(i + 1) * 30}deg) translate(0, -130px) rotate(-${(i + 1) * 30}deg)` }}>{i + 1}</div>
                        ))}
                        <div className="absolute w-3 h-24 bg-red-500 rounded-full origin-bottom bottom-1/2 z-10" style={{ transform: `rotate(${hourRotation}deg)` }}></div>
                        <div className="absolute w-2 h-32 bg-blue-600 rounded-full origin-bottom bottom-1/2" style={{ transform: `rotate(${minuteRotation}deg)` }}></div>
                        <div className="absolute w-5 h-5 bg-gray-800 rounded-full z-20"></div>
                    </div>
                    <div className="text-4xl font-bold text-blue-800 mb-6 bg-white px-8 py-4 rounded-2xl shadow-md shrink-0">{formatTime(minutes)}</div>
                    <div className="w-full max-w-md px-4 shrink-0">
                        <input type="range" min="0" max="720" value={minutes} onChange={(e) => setMinutes(Number(e.target.value))} className="w-full h-8 bg-blue-200 rounded-lg appearance-none cursor-pointer" />
                        <p className="text-center text-gray-500 mt-2">동그라미를 움직여 보세요!</p>
                    </div>
                </div>
            );
        };

        // --- 3. 엉뚱 문장 ---
        const SillySentences = () => {
            const whoList = ["교장 선생님이", "강아지가", "슈퍼맨이", "내 짝꿍이", "외계인이", "호랑이가", "코딱지 대장이", "엘사 공주가", "지나가던 개미가", "방귀쟁이가", "투명인간이", "우리 반 회장이"];
            const whereList = ["화장실에서", "운동장에서", "냉장고 안에서", "구름 위에서", "책상 밑에서", "달나라에서", "이불 속에서", "급식실에서", "놀이터 미끄럼틀에서", "교장실에서", "꿈 속에서", "물속에서"];
            const whatList = ["춤을 춥니다", "라면을 먹습니다", "방귀를 뀝니다", "잠을 잡니다", "노래를 부릅니다", "수영을 합니다", "코를 팝니다", "엉덩이 춤을 춥니다", "숙제를 합니다", "울고 있습니다", "소리를 지릅니다", "넘어집니다"];
            
            const [step, setStep] = useState(0);
            const [sentence, setSentence] = useState({ w: "?", wh: "?", wt: "?" });

            const handleNextStep = () => {
                if (step === 0) {
                    setSentence({
                        w: whoList[Math.floor(Math.random() * whoList.length)],
                        wh: whereList[Math.floor(Math.random() * whereList.length)],
                        wt: whatList[Math.floor(Math.random() * whatList.length)],
                    });
                    setStep(1);
                } else if (step === 1) setStep(2);
                else if (step === 2) setStep(3);
                else setStep(0);
            };

            return (
                <div className="flex flex-col items-center justify-center h-full bg-green-50 p-4 overflow-y-auto">
                    <h2 className="text-3xl font-bold mb-6 text-green-700 shrink-0">🤣 엉뚱 문장 공장</h2>
                    <div className="flex flex-col md:flex-row gap-4 mb-8 w-full max-w-3xl justify-center items-center shrink-0">
                        <div className={`transition-all duration-500 bg-white p-6 rounded-2xl shadow-lg border-b-4 border-red-400 w-full md:w-1/3 text-center min-h-[120px] flex flex-col items-center justify-center ${step >= 1 ? 'opacity-100 scale-100' : 'opacity-50 scale-95'}`}>
                            <span className="text-sm text-red-400 font-bold mb-2">누가?</span>
                            <span className="text-2xl font-bold text-gray-800 break-keep">{step >= 1 ? sentence.w : "?"}</span>
                        </div>
                        <div className={`transition-all duration-500 bg-white p-6 rounded-2xl shadow-lg border-b-4 border-yellow-400 w-full md:w-1/3 text-center min-h-[120px] flex flex-col items-center justify-center ${step >= 2 ? 'opacity-100 scale-100' : 'opacity-50 scale-95'}`}>
                            <span className="text-sm text-yellow-500 font-bold mb-2">어디서?</span>
                            <span className="text-2xl font-bold text-gray-800 break-keep">{step >= 2 ? sentence.wh : "?"}</span>
                        </div>
                        <div className={`transition-all duration-500 bg-white p-6 rounded-2xl shadow-lg border-b-4 border-blue-400 w-full md:w-1/3 text-center min-h-[120px] flex flex-col items-center justify-center ${step >= 3 ? 'opacity-100 scale-100' : 'opacity-50 scale-95'}`}>
                            <span className="text-sm text-blue-400 font-bold mb-2">무엇을?</span>
                            <span className="text-2xl font-bold text-gray-800 break-keep">{step >= 3 ? sentence.wt : "?"}</span>
                        </div>
                    </div>
                    <button onClick={handleNextStep} className={`text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transform transition active:scale-95 flex items-center gap-3 shrink-0 ${step === 3 ? 'bg-orange-500 hover:bg-orange-600' : 'bg-green-500 hover:bg-green-600'}`}>
                        {step === 0 && <IconShuffle/>} {step === 3 && <IconRefresh/>}
                        {step === 0 ? "문장 만들기 시작!" : step === 1 ? "어디서?" : step === 2 ? "무엇을?" : "다시 하기"}
                    </button>
                    <p className="mt-4 text-gray-500 shrink-0">버튼을 눌러 하나씩 열어보세요!</p>
                </div>
            );
        };

        // --- 4. 길 찾기 ---
        const MazeGame = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            const [target, setTarget] = useState({ x: 4, y: 4 });
            const [theme, setTheme] = useState({ p: "🐥", t: "🐛" });
            const themes = [{ p: "🐥", t: "🐛" }, { p: "🐶", t: "🦴" }, { p: "🐱", t: "🐟" }, { p: "🐰", t: "🥕" }, { p: "👮", t: "🚓" }, { p: "👽", t: "🛸" }];

            const initializeGame = () => {
                const randomTheme = themes[Math.floor(Math.random() * themes.length)];
                setTheme(randomTheme);
                let newStart, newTarget;
                do {
                    newStart = { x: Math.floor(Math.random() * 5), y: Math.floor(Math.random() * 5) };
                    newTarget = { x: Math.floor(Math.random() * 5), y: Math.floor(Math.random() * 5) };
                } while ((newStart.x === newTarget.x && newStart.y === newTarget.y) || (Math.abs(newStart.x - newTarget.x) + Math.abs(newStart.y - newTarget.y) < 2));
                setPos(newStart);
                setTarget(newTarget);
            };

            useEffect(() => { initializeGame(); }, []);

            const move = (dx, dy) => {
                setPos(prev => {
                    const newX = Math.max(0, Math.min(4, prev.x + dx));
                    const newY = Math.max(0, Math.min(4, prev.y + dy));
                    return { x: newX, y: newY };
                });
            };

            const isSuccess = pos.x === target.x && pos.y === target.y;

            return (
                <div className="flex flex-col items-center justify-center h-full bg-purple-50 p-2 overflow-y-auto">
                    <div className="flex justify-between items-center w-full max-w-md mb-2 shrink-0">
                        <h2 className="text-2xl font-bold text-purple-700">길 찾기 놀이</h2>
                        <button onClick={initializeGame} className="bg-purple-200 text-purple-800 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-1 hover:bg-purple-300"><IconRefresh size={14}/> 다른 문제</button>
                    </div>
                    {isSuccess && (
                        <div className="absolute inset-0 bg-black/50 flex items-center justify-center z-50 rounded-xl">
                            <div className="bg-white p-8 rounded-3xl text-center animate-bounce shadow-2xl border-4 border-purple-300">
                                <h3 className="text-4xl font-bold text-purple-600 mb-4">도착 성공! 🎉</h3>
                                <div className="text-6xl mb-6">{theme.p} ❤️ {theme.t}</div>
                                <button onClick={initializeGame} className="bg-purple-500 text-white px-8 py-3 rounded-xl font-bold text-xl hover:bg-purple-600 shadow-lg">다음 문제 풀기</button>
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-5 gap-1 bg-white p-2 rounded-xl shadow-lg border-4 border-purple-200 mb-2 shrink-0">
                        {[...Array(25)].map((_, i) => {
                            const x = i % 5;
                            const y = Math.floor(i / 5);
                            return (
                                <div key={i} className="w-10 h-10 sm:w-14 sm:h-14 bg-gray-100 rounded-lg flex items-center justify-center text-2xl sm:text-3xl border border-gray-200">
                                    {pos.x === x && pos.y === y ? theme.p : target.x === x && target.y === y ? theme.t : ""}
                                </div>
                            );
                        })}
                    </div>
                    <div className="grid grid-cols-3 gap-2 mt-2 shrink-0 mb-4">
                        <div></div>
                        <button onClick={() => move(0, -1)} className="bg-purple-500 active:bg-purple-600 text-white p-3 sm:p-4 rounded-xl shadow-md flex justify-center"><IconArrowUp size={28}/></button>
                        <div></div>
                        <button onClick={() => move(-1, 0)} className="bg-purple-500 active:bg-purple-600 text-white p-3 sm:p-4 rounded-xl shadow-md flex justify-center"><IconArrowLeft size={28}/></button>
                        <button onClick={() => move(0, 1)} className="bg-purple-500 active:bg-purple-600 text-white p-3 sm:p-4 rounded-xl shadow-md flex justify-center"><IconArrowDown size={28}/></button>
                        <button onClick={() => move(1, 0)} className="bg-purple-500 active:bg-purple-600 text-white p-3 sm:p-4 rounded-xl shadow-md flex justify-center"><IconArrowRight size={28}/></button>
                    </div>
                </div>
            );
        };

        // --- 5. 그림판 ---
        const DrawingBoard = () => {
            const canvasRef = useRef(null);
            const [color, setColor] = useState("#000000");
            const [isDrawing, setIsDrawing] = useState(false);
            const [lineWidth, setLineWidth] = useState(5);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const resizeCanvas = () => {
                    const parent = canvas.parentElement;
                    canvas.width = parent.clientWidth;
                    canvas.height = parent.clientHeight;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                };
                setTimeout(resizeCanvas, 100);
                window.addEventListener('resize', resizeCanvas);
                return () => window.removeEventListener('resize', resizeCanvas);
            }, []);

            const startDrawing = (e) => {
                const ctx = canvasRef.current.getContext('2d');
                const { offsetX, offsetY } = getCoordinates(e);
                ctx.beginPath();
                ctx.moveTo(offsetX, offsetY);
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const ctx = canvasRef.current.getContext('2d');
                const { offsetX, offsetY } = getCoordinates(e);
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.lineTo(offsetX, offsetY);
                ctx.stroke();
            };

            const getCoordinates = (event) => {
                if (event.touches) {
                    const rect = canvasRef.current.getBoundingClientRect();
                    return { offsetX: event.touches[0].clientX - rect.left, offsetY: event.touches[0].clientY - rect.top };
                } else return { offsetX: event.nativeEvent.offsetX, offsetY: event.nativeEvent.offsetY };
            };

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            };

            const colors = ["#000000", "#FF0000", "#FFA500", "#FFFF00", "#008000", "#0000FF", "#800080", "#FFFFFF"];

            return (
                <div className="flex flex-col h-full bg-white relative">
                    <div className="flex justify-between items-center p-2 bg-pink-100 border-b-2 border-pink-200 shrink-0">
                        <div className="flex gap-2 items-center">
                            {colors.map((c) => (
                                <button key={c} onClick={() => { setColor(c); setLineWidth(c === "#FFFFFF" ? 30 : 5); }} className={`w-8 h-8 rounded-full border-2 shadow-sm ${color === c ? 'ring-2 ring-pink-500 scale-110' : 'border-gray-300'}`} style={{ backgroundColor: c }}>
                                    {c === "#FFFFFF" && <span className="flex items-center justify-center text-gray-400"><IconEraser/></span>}
                                </button>
                            ))}
                        </div>
                        <button onClick={clearCanvas} className="bg-white border-2 border-red-200 text-red-500 px-3 py-1 rounded-full font-bold text-sm flex items-center gap-1 hover:bg-red-50"><IconTrash/> 모두 지우기</button>
                    </div>
                    <div className="flex-1 w-full bg-white cursor-crosshair touch-none">
                        <canvas ref={canvasRef} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={() => setIsDrawing(false)} onMouseLeave={() => setIsDrawing(false)} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={() => setIsDrawing(false)} className="w-full h-full" />
                    </div>
                </div>
            );
        };

        // --- 6. 비밀 수첩 ---
        const Notepad = ({ text, setText }) => {
            const [showSaved, setShowSaved] = useState(false);
            const handleSave = () => { setShowSaved(true); setTimeout(() => setShowSaved(false), 2000); };

            return (
                <div className="flex flex-col h-full bg-teal-50 p-4 overflow-hidden relative">
                    <div className="flex justify-between items-center mb-4 shrink-0">
                        <h2 className="text-2xl font-bold text-teal-700 flex items-center gap-2"><IconNote/> 비밀 수첩</h2>
                        <div className="flex gap-2">
                            <button onClick={() => { setText(''); setShowSaved(false); }} className="bg-white text-gray-500 border-2 border-gray-300 px-3 py-1.5 rounded-full font-bold text-sm hover:bg-gray-50 flex items-center gap-1"><IconTrash/> 지우기</button>
                            <button onClick={handleSave} className="bg-teal-500 text-white px-4 py-1.5 rounded-full font-bold text-sm hover:bg-teal-600 shadow-md flex items-center gap-1 transition"><IconSave/> 저장하기</button>
                        </div>
                    </div>
                    {showSaved && <div className="absolute top-20 left-1/2 transform -translate-x-1/2 bg-teal-600 text-white px-6 py-2 rounded-full shadow-lg z-10 flex items-center gap-2"><IconCheck/> 저장되었어요!</div>}
                    <div className="flex-1 bg-white rounded-xl shadow-lg border-4 border-teal-200 p-6 overflow-hidden relative">
                        <div className="absolute inset-0 pointer-events-none opacity-20 notebook-line"></div>
                        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="여기에 오늘 있었던 일이나 재미있는 생각을 적어보세요." className="w-full h-full resize-none focus:outline-none text-xl leading-[40px] text-gray-700 bg-transparent font-medium" style={{ lineHeight: '40px' }} />
                    </div>
                </div>
            );
        };

        // --- 메인 앱 ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('menu');
            const [pickerNames, setPickerNames] = useState("김철수, 이영희, 박민준, 최지우, 정서윤");
            const [memoText, setMemoText] = useState("");

            const renderContent = () => {
                switch (activeTab) {
                    case 'picker': return <RandomPicker names={pickerNames} setNames={setPickerNames} />;
                    case 'clock': return <ClockApp />;
                    case 'sentences': return <SillySentences />;
                    case 'maze': return <MazeGame />;
                    case 'drawing': return <DrawingBoard />;
                    case 'notepad': return <Notepad text={memoText} setText={setMemoText} />;
                    default: return <Menu onSelect={setActiveTab} />;
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-2 select-none">
                    <div className="w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden h-[90vh] flex flex-col border-8 border-yellow-300">
                        <div className="bg-yellow-300 p-3 flex justify-between items-center shrink-0">
                            <h1 className="text-xl md:text-2xl font-black text-yellow-900 flex items-center gap-2">🏫 우리 반 만능 놀이터</h1>
                            {activeTab !== 'menu' && (
                                <button onClick={() => setActiveTab('menu')} className="bg-white text-yellow-800 px-3 py-1.5 rounded-full font-bold shadow-md hover:bg-yellow-50 flex items-center gap-1 transition text-sm">
                                    <IconHome/> 홈으로
                                </button>
                            )}
                        </div>
                        <div className="flex-1 overflow-hidden relative">
                            {renderContent()}
                        </div>
                    </div>
                </div>
            );
        };

        const Menu = ({ onSelect }) => {
            const menuItems = [
                { id: 'picker', title: '발표 왕 뽑기', icon: <IconPicker/>, color: 'bg-orange-100 text-orange-600 hover:bg-orange-200' },
                { id: 'clock', title: '시계 놀이', icon: <IconClock/>, color: 'bg-blue-100 text-blue-600 hover:bg-blue-200' },
                { id: 'sentences', title: '엉뚱 문장', icon: <IconShuffle/>, color: 'bg-green-100 text-green-600 hover:bg-green-200' },
                { id: 'maze', title: '길 찾기', icon: <IconMap/>, color: 'bg-purple-100 text-purple-600 hover:bg-purple-200' },
                { id: 'drawing', title: '맘대로 그림판', icon: <IconPalette/>, color: 'bg-pink-100 text-pink-600 hover:bg-pink-200' },
                { id: 'notepad', title: '비밀 수첩', icon: <IconNote/>, color: 'bg-teal-100 text-teal-600 hover:bg-teal-200' },
            ];

            return (
                <div className="p-4 h-full flex flex-col items-center justify-center bg-yellow-50 overflow-y-auto">
                    <h2 className="text-xl text-gray-600 mb-6 font-bold text-center">선생님, 오늘은 무엇을 할까요?</h2>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 w-full max-w-3xl">
                        {menuItems.map((item) => (
                            <button key={item.id} onClick={() => onSelect(item.id)} className={`${item.color} p-4 rounded-3xl shadow-lg transform transition hover:scale-105 flex flex-col items-center justify-center gap-2 border-b-8 border-black/10 aspect-square sm:aspect-auto sm:h-36`}>
                                <div className="bg-white/50 p-3 rounded-full">{item.icon}</div>
                                <span className="text-lg sm:text-xl font-bold">{item.title}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
