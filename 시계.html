<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>초등 1학년 시계 공부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif; /* 귀여운 둥근 폰트 적용 */
            background-color: #fdf6e3; /* 따뜻한 배경색 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* 스크롤 방지 */
            touch-action: none; /* 드래그 시 화면 스크롤 방지 */
        }

        #clock-container {
            position: relative;
            width: 400px; /* 시계를 더 크게 (기존 300px -> 400px) */
            height: 400px;
            background-color: white;
            border-radius: 50%;
            border: 16px solid #ffb347; /* 시계 테두리 두께 조절 */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset 0 5px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .number {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 38px;
            font-weight: bold;
            color: #4a4a4a;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* 눈금선 */
        .tick {
            position: absolute;
            width: 4px;
            height: 12px;
            background-color: #ccc;
            top: 50%;
            left: 50%;
        }
        .tick.major {
            width: 6px;
            height: 20px;
            background-color: #666;
        }

        #hour-track {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 270px; /* 흔적이 숫자에 더 가깝게 닿도록 크기 확장 */
            height: 270px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            /* JS에서 conic-gradient를 사용하여 그려짐 */
            pointer-events: none; /* 클릭 이벤트 방지 */
            z-index: 5;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%; /* 바늘 끝을 기준으로 회전 */
            border-radius: 10px;
            z-index: 10;
        }

        #hour-hand {
            width: 6px; /* 시침 두께를 얇게 하여 흔적이 일찍 보이도록 수정 */
            height: 100px;
            background-color: #ff6b6b; /* 빨간색 시침 */
            transform: translateX(-50%) rotate(0deg);
        }

        #minute-hand {
            width: 4px;
            height: 150px;
            background-color: #4ecdc4; /* 청록색 분침 */
            transform: translateX(-50%) rotate(0deg);
            cursor: grab; /* 드래그 가능 표시 */
            z-index: 15; /* 분침이 제일 위에 오도록 */
        }
        
        #minute-hand:active {
            cursor: grabbing;
        }

        /* 분침 드래그 영역 확장을 위한 투명 요소 */
        #minute-hit-area {
            position: absolute;
            width: 60px;
            height: 170px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background-color: transparent;
            z-index: 20;
            cursor: grab;
        }
        #minute-hand-container {
             position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            z-index: 15;
            width: 0;
            height: 0;
        }

        /* 중심점 */
        #center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background-color: #ffce00;
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
        }

        #time-display {
            background-color: white;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 36px;
            color: #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 4px solid #4ecdc4;
            min-width: 200px;
            text-align: center;
        }

        /* 안내 문구 */
        .instruction {
            margin-top: 20px;
            font-size: 20px;
            color: #666;
            text-align: center;
            padding: 0 20px;
        }
        
        .highlight {
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="text-4xl font-bold text-[#ffb347] mb-6 drop-shadow-md">시계 돌리기 놀이</div>
    
    <div id="clock-container">
        <!-- 눈금선이 JS에 의해 여기에 추가됩니다. -->
        <!-- 숫자가 JS에 의해 여기에 추가됩니다. -->
        
        <!-- 시침 이동 궤적을 보여줄 영역 -->
        <div id="hour-track"></div>
        
        <!-- 시침 -->
        <div id="hour-hand" class="hand"></div>
        
        <!-- 분침 컨테이너 (회전 및 드래그 영역 포함) -->
        <div id="minute-hand-container">
            <div id="minute-hand" class="hand" style="bottom: 0;"></div>
            <div id="minute-hit-area"></div>
        </div>
        
        <!-- 시계 중앙 점 -->
        <div id="center-dot"></div>
    </div>

    <!-- 현재 시각 표시 -->
    <div id="time-display">12시 정각</div>

    <div class="instruction">
        긴 바늘<span style="color:#4ecdc4;">(분침)</span>을 빙글빙글 돌려보세요!<br>
        짧은 바늘<span class="highlight">(시침)</span>이 어떻게 움직이는지 살펴볼까요?
    </div>

    <script>
        const clockContainer = document.getElementById('clock-container');
        const hourHand = document.getElementById('hour-hand');
        const minuteContainer = document.getElementById('minute-hand-container');
        const minuteHitArea = document.getElementById('minute-hit-area');
        const hourTrack = document.getElementById('hour-track');
        const timeDisplay = document.getElementById('time-display');

        const CLOCK_RADIUS = 200; // 시계 크기 확대(400px)에 맞춘 반지름
        let isDragging = false;
        
        // 현재 시간 상태 (분 단위 기준, 0 = 12:00, 720 = 11:59)
        // 12시 0분으로 시작
        let currentTotalMinutes = 0; 

        function drawClockFace() {
            // 눈금 그리기 (60개)
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.classList.add('tick');
                if (i % 5 === 0) tick.classList.add('major');
                
                // 중심(50%, 50%)을 잡고, 회전시킨 뒤 바깥으로 밀어냅니다.
                tick.style.transform = `translate(-50%, -50%) rotate(${i * 6}deg) translateY(-175px)`;
                clockContainer.appendChild(tick);
            }

            // 숫자 그리기 (1~12)
            const numberRadius = 135; // 숫자와 눈금이 겹치지 않는 최적의 거리
            for (let i = 1; i <= 12; i++) {
                const num = document.createElement('div');
                num.classList.add('number');
                num.innerText = i;
                
                // 눈금과 100% 동일한 방식으로 위치 계산 (오차 발생 원천 차단)
                // 중앙 위치 -> 눈금 방향으로 회전 -> 바깥으로 밀어내기 -> 숫자 글씨가 똑바로 보이도록 반대로 회전
                num.style.transform = `translate(-50%, -50%) rotate(${i * 30}deg) translateY(-${numberRadius}px) rotate(-${i * 30}deg)`;
                
                clockContainer.appendChild(num);
            }
            
            // z-index 조정을 위해 기존 요소들 다시 맨 위로 올리기
            clockContainer.appendChild(hourTrack);
            clockContainer.appendChild(hourHand);
            clockContainer.appendChild(minuteContainer);
            clockContainer.appendChild(document.getElementById('center-dot'));
        }

        function updateClock(totalMinutes) {
            // 시간 계산 (12시간제)
            let hours = Math.floor(totalMinutes / 60) % 12;
            if (hours === 0) hours = 12;
            const minutes = Math.floor(totalMinutes % 60);

            // 각도 계산
            // 분침: 1분에 6도 회전
            const minuteAngle = totalMinutes * 6;
            // 시침: 1시간에 30도, 1분에 0.5도 회전
            const hourAngle = (hours % 12) * 30 + (minutes * 0.5);

            // 바늘 회전 적용
            minuteContainer.style.transform = `rotate(${minuteAngle}deg)`;
            hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;

            // 텍스트 업데이트
            let timeText = `${hours}시`;
            if (minutes === 0) {
                // 정각일 때는 '시'만 표시하도록 수정
            } else if (minutes === 30) {
                timeText += ` 30분`; // 반이라는 글자 제외, 30분 명시
            } else {
                timeText += ` ${minutes}분`;
            }
            timeDisplay.innerText = timeText;

            // 현재 시간이 위치한 기본 각도 (정각 기준)
            const baseHourAngle = (hours % 12) * 30; 
            
            // 분침이 움직인 만큼 시침이 이동한 궤적을 그림
            if (minutes > 0) {
                // 부채꼴 모양으로 색칠하기 위해 conic-gradient 사용
                // baseHourAngle에서 시작해서 hourAngle까지 색칠
                const startAngle = baseHourAngle;
                const endAngle = hourAngle;
                
                // 시계 12시 방향(0도)을 기준으로 css conic-gradient는 북쪽부터 시작
                hourTrack.style.background = `conic-gradient(
                    from ${startAngle}deg at 50% 50%, 
                    rgba(255, 107, 107, 0.4) 0deg, 
                    rgba(255, 107, 107, 0.4) ${endAngle - startAngle}deg, 
                    transparent ${endAngle - startAngle}deg
                )`;
            } else {
                // 정각일 때는 흔적을 지움
                hourTrack.style.background = 'transparent';
            }
        }

        function getAngle(e) {
            const rect = clockContainer.getBoundingClientRect();
            // 시계 중심점 좌표 계산
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // 터치 또는 마우스 이벤트의 현재 좌표
            let clientX, clientY;
            if (e.type.startsWith('touch')) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // 중심점으로부터의 거리 (x, y)
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            
            // atan2를 이용해 각도 계산 (라디안 -> 디그리)
            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
            
            // 12시 방향을 0도로 맞추기 위한 보정 (기본 수학적 0도는 3시 방향)
            angle = angle + 90;
            if (angle < 0) {
                angle += 360;
            }
            return angle;
        }

        let previousMinuteAngle = 0;

        function onDragStart(e) {
            e.preventDefault(); // 기본 터치 동작(스크롤 등) 방지
            isDragging = true;
            // 드래그 시작 시점의 각도 저장
            previousMinuteAngle = getAngle(e);
        }

        function onDragMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            
            const currentAngle = getAngle(e);
            
            // 이전 각도와 현재 각도의 차이를 구함
            let angleDiff = currentAngle - previousMinuteAngle;
            
            // 0도 <-> 360도 경계선 처리를 위한 보정 (갑자기 크게 튀는 현상 방지)
            if (angleDiff > 180) {
                angleDiff -= 360;
            } else if (angleDiff < -180) {
                angleDiff += 360;
            }

            // 1분에 6도이므로, 각도 차이를 분으로 변환
            const minutesDiff = angleDiff / 6;
            
            // 전체 누적 시간에 반영
            currentTotalMinutes += minutesDiff;
            
            // 음수 시간이 되지 않도록 처리 (12시간 = 720분 루프)
            if (currentTotalMinutes < 0) {
                 currentTotalMinutes += 720;
            }
            
            updateClock(currentTotalMinutes);
            previousMinuteAngle = currentAngle;
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            
            // 드래그가 끝났을 때 초등학생들이 명확하게 알 수 있도록
            // 가장 가까운 1분 단위로 반올림 처리 (스냅 효과)
            currentTotalMinutes = Math.round(currentTotalMinutes);
            updateClock(currentTotalMinutes);
        }

        // 분침 컨테이너(hit area 포함)에 이벤트 등록
        minuteContainer.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);

        minuteContainer.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);

        drawClockFace();
        updateClock(currentTotalMinutes); // 12시 0분으로 초기화

    </script>
</body>
</html>
