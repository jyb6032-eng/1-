<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>1학년 학습 앱 모음</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #fef6e4, #e0f7fa);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 {
    font-size: 2.2em;
    color: #444;
    margin-bottom: 10px;
  }
  p.sub {
    color: #777;
    margin-bottom: 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 24px;
    max-width: 900px;
    width: 100%;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    text-decoration: none;
    color: #333;
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 22px rgba(0,0,0,0.14);
  }
  .emoji {
    font-size: 3em;
    display: block;
    margin-bottom: 12px;
  }
  .card h2 {
    margin: 0 0 6px 0;
    font-size: 1.15em;
  }
  .card p {
    margin: 0;
    font-size: 0.85em;
    color: #888;
  }
</style>
</head>
<body>

  <h1>📚 1학년 학습 앱 모음</h1>
  <p class="sub">하고 싶은 활동을 눌러보세요!</p>

  <div class="grid">

    <a class="card" href="말하는대로.html">
      <span class="emoji">🎤</span>
      <h2>말하는대로</h2>
      <p>말한 내용을 글자로 바꿔줘요</p>
    </a>

    <a class="card" href="글자조합.html">
      <span class="emoji">🔤</span>
      <h2>글자조합</h2>
      <p>초성·중성·받침을 조합해봐요</p>
    </a>

    <a class="card" href="매일아침한글.html">
      <span class="emoji">🌅</span>
      <h2>매일아침한글</h2>
      <p>오늘의 낱말을 읽어봐요</p>
    </a>

    <a class="card" href="받아쓰기.html">
      <span class="emoji">✏️</span>
      <h2>받아쓰기</h2>
      <p>듣고 따라 써봐요</p>
    </a>

    <a class="card" href="시계.html">
      <span class="emoji">🕐</span>
      <h2>시계</h2>
      <p>바늘을 돌려 시각을 맞혀봐요</p>
    </a>

    <a class="card" href="우리반만능놀이터.html">
      <span class="emoji">🎡</span>
      <h2>우리반만능놀이터</h2>
      <p>여러 활동을 놀이처럼 해봐요</p>
    </a>

    <a class="card" href="체크리스트.html">
      <span class="emoji">📋</span>
      <h2>체크리스트</h2>
      <p>할 일을 확인해봐요</p>
    </a>

    <!--
      새 앱을 추가하려면 위 <a class="card">...</a> 블록을 통째로 복사해서
      여기 붙여넣고, href 경로와 이모지·제목·설명만 바꿔주세요.
    -->

  </div>

</body>
</html>
