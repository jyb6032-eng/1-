<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>번호 체크리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF6F5;
    --card:#FFFFFF;
    --ink:#16324F;
    --sub:#5C7A85;
    --stamp:#E85D4C;
    --stamp-dark:#B23F31;
    --yellow:#F4B942;
    --line:#CFE3E0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:24px 12px 60px;
  }
  .wrap{max-width:460px;margin:0 auto;}
  h1{
    font-family:'Do Hyeon', sans-serif;
    font-size:28px;
    text-align:center;
    margin:0 0 4px;
    letter-spacing:1px;
  }
  .sub{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);
    border-radius:18px;
    padding:18px 16px;
    box-shadow:0 2px 10px rgba(22,50,79,0.06);
    margin-bottom:16px;
  }
  .row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
  .row label{font-size:13px;color:var(--sub);white-space:nowrap;}
  input[type=date], input[type=text], input[type=number]{
    flex:1;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  input[type=number]{max-width:70px;flex:none;}
  .tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    min-width:60px;
    padding:8px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:'Do Hyeon',sans-serif;
    font-size:14px;
    color:var(--sub);
    cursor:pointer;
    text-align:center;
  }
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin:14px 0 4px;
  }
  .stamp-btn{
    position:relative;
    aspect-ratio:1;
    border-radius:50%;
    border:2.5px solid var(--stamp);
    background:#fff;
    color:var(--stamp-dark);
    font-family:'Do Hyeon',sans-serif;
    font-size:18px;
    cursor:pointer;
    transition:transform .15s ease;
    outline:none;
  }
  .stamp-btn:active{transform:scale(0.9);}
  .stamp-btn.done{
    background:var(--stamp);
    color:#fff;
    border-color:var(--stamp-dark);
    animation:thump .25s ease;
  }
  @keyframes thump{
    0%{transform:scale(1.35) rotate(-8deg);}
    60%{transform:scale(0.92) rotate(3deg);}
    100%{transform:scale(1) rotate(0);}
  }
  .actions{display:flex;gap:8px;margin-top:14px;}
  button.action{
    flex:1;
    border:none;
    border-radius:12px;
    padding:12px;
    font-family:'Do Hyeon',sans-serif;
    font-size:15px;
    cursor:pointer;
  }
  .save{background:var(--ink);color:#fff;}
  .reset{background:#fff;color:var(--stamp-dark);border:1.5px solid var(--stamp);}
  .count{
    text-align:center;
    font-size:13px;
    color:var(--sub);
    margin-top:10px;
  }
  .count b{color:var(--stamp-dark);font-size:15px;}
  .history-title{
    font-family:'Do Hyeon',sans-serif;
    font-size:16px;
    margin:0 0 10px;
  }
  .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-tag{color:var(--sub);}
  .hist-nums{color:var(--stamp-dark);font-weight:500;text-align:right;flex:1;margin-left:10px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:10px 0;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <h1>오늘의 체크리스트</h1>
  <p class="sub">번호를 눌러 도장을 찍어보세요</p>

  <div class="card">
    <div class="row">
      <label>날짜</label>
      <input type="date" id="dateInput">
    </div>
    <div class="row">
      <label>인원</label>
      <input type="number" id="countInput" min="1" max="40" value="24">
      <label>명</label>
    </div>

    <div class="tabbar" id="tabBar"></div>
    <input type="text" id="titleInput" placeholder="예: 아침독서, 수학익힘책 검사">

    <div class="grid" id="grid"></div>

    <p class="count" id="countText"></p>

    <div class="actions">
      <button class="action save" id="saveBtn">저장하기</button>
      <button class="action reset" id="resetBtn">초기화</button>
    </div>
  </div>

  <div class="card">
    <p class="history-title">이 날짜의 저장 기록</p>
    <div id="historyList"><p class="empty">아직 저장한 기록이 없어요.</p></div>
  </div>
</div>

<div class="toast" id="toast">저장되었어요</div>

<script>
const TAB_COUNT = 6;
let currentTab = 0;
let tabStates = Array.from({length: TAB_COUNT}, () => ({ title: '', checked: new Set() }));
let studentCount = 24;

const dateInput = document.getElementById('dateInput');
const countInput = document.getElementById('countInput');
const tabBar = document.getElementById('tabBar');
const titleInput = document.getElementById('titleInput');
const grid = document.getElementById('grid');
const countText = document.getElementById('countText');
const historyList = document.getElementById('historyList');
const toast = document.getElementById('toast');

const today = new Date().toISOString().slice(0,10);
dateInput.value = today;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1400);
}

function renderTabs(){
  tabBar.innerHTML = '';
  for(let i=0;i<TAB_COUNT;i++){
    const b = document.createElement('button');
    b.type='button';
    b.className = 'tab' + (i===currentTab ? ' active':'');
    b.textContent = tabStates[i].title || ('탭 '+(i+1));
    b.addEventListener('click', ()=>switchTab(i));
    tabBar.appendChild(b);
  }
}

function switchTab(idx){
  tabStates[currentTab].title = titleInput.value;
  currentTab = idx;
  titleInput.value = tabStates[currentTab].title;
  renderTabs();
  renderGrid();
}

function renderGrid(){
  grid.innerHTML = '';
  const checked = tabStates[currentTab].checked;
  for(let n=1;n<=studentCount;n++){
    const btn = document.createElement('button');
    btn.type='button';
    btn.className = 'stamp-btn' + (checked.has(n) ? ' done':'');
    btn.textContent = n;
    btn.addEventListener('click', ()=>{
      if(checked.has(n)){ checked.delete(n); btn.classList.remove('done'); }
      else{ checked.add(n); btn.classList.add('done'); }
      updateCount();
    });
    grid.appendChild(btn);
  }
  updateCount();
}

function updateCount(){
  const c = tabStates[currentTab].checked.size;
  countText.innerHTML = '<b>'+c+'</b> / '+studentCount+'명 완료';
}

countInput.addEventListener('change', ()=>{
  let v = parseInt(countInput.value, 10);
  if(isNaN(v) || v<1) v = 1;
  if(v>40) v = 40;
  studentCount = v;
  countInput.value = v;
  tabStates.forEach(t => { t.checked = new Set([...t.checked].filter(n => n<=v)); });
  renderGrid();
  saveConfig();
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  tabStates[currentTab].title = titleInput.value;
  const state = tabStates[currentTab];
  if(state.checked.size === 0){ showToast('체크된 번호가 없어요'); return; }

  const key = 'record:'+dateInput.value+':'+currentTab;
  const record = {
    date: dateInput.value,
    title: state.title || ('탭 '+(currentTab+1)),
    numbers: [...state.checked].sort((a,b)=>a-b),
    studentCount
  };
  try{
    await window.storage.set(key, JSON.stringify(record), false);
    showToast('저장되었어요');
    renderHistory();
  }catch(e){
    showToast('저장에 실패했어요');
  }
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  tabStates[currentTab].checked.clear();
  renderGrid();
});

dateInput.addEventListener('change', loadDate);

async function loadDate(){
  historyList.innerHTML = '<p class="empty">불러오는 중...</p>';
  tabStates.forEach(t => { t.title=''; t.checked=new Set(); });

  try{
    const list = await window.storage.list('record:'+dateInput.value+':', false);
    if(!list || !list.keys || list.keys.length === 0){
      historyList.innerHTML = '<p class="empty">아직 저장한 기록이 없어요.</p>';
    } else {
      const items = [];
      for(const k of list.keys){
        const parts = k.split(':');
        const tabIdx = parseInt(parts[2], 10);
        try{
          const r = await window.storage.get(k, false);
          if(r){
            const rec = JSON.parse(r.value);
            items.push(rec);
            if(!isNaN(tabIdx) && tabIdx>=0 && tabIdx<TAB_COUNT){
              tabStates[tabIdx].title = rec.title;
              tabStates[tabIdx].checked = new Set(rec.numbers);
            }
          }
        }catch(e){}
      }
      if(items.length === 0){
        historyList.innerHTML = '<p class="empty">아직 저장한 기록이 없어요.</p>';
      } else {
        historyList.innerHTML = '';
        items.forEach(r=>{
          const div = document.createElement('div');
          div.className = 'hist-item';
          div.innerHTML = '<span class="hist-tag">'+r.title+'</span><span class="hist-nums">'+r.numbers.join(', ')+'</span>';
          historyList.appendChild(div);
        });
      }
    }
  }catch(e){
    historyList.innerHTML = '<p class="empty">불러오기에 실패했어요.</p>';
  }

  titleInput.value = tabStates[currentTab].title;
  renderTabs();
  renderGrid();
}

async function saveConfig(){
  try{
    await window.storage.set('config:studentCount', String(studentCount), false);
  }catch(e){}
}

async function loadConfig(){
  try{
    const r = await window.storage.get('config:studentCount', false);
    if(r && r.value){
      studentCount = parseInt(r.value, 10) || 24;
      countInput.value = studentCount;
    }
  }catch(e){}
}

(async ()=>{
  await loadConfig();
  await loadDate();
})();
</script>
</body>
</html>
