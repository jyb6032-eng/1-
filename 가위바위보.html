<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가위바위보 게임</title>
<style>
  :root{
    --bg1:#fff6e5;
    --bg2:#e5f4ff;
    --accent:#ff8a5b;
    --accent-dark:#f2683c;
    --win:#4caf50;
    --lose:#e85c5c;
    --draw:#f2a93b;
    --card:#ffffff;
    --text:#3a3a3a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 12px 48px;
    color:var(--text);
  }
  h1{
    font-size:2.4rem;
    margin:12px 0 4px;
    text-align:center;
  }
  .subtitle{
    font-size:1.1rem;
    color:#777;
    margin-bottom:20px;
    text-align:center;
  }
  .scoreboard{
    display:flex;
    gap:16px;
    margin-bottom:24px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .score-box{
    background:var(--card);
    border-radius:16px;
    padding:12px 22px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    min-width:90px;
  }
  .score-box .label{font-size:0.95rem;color:#888;}
  .score-box .value{font-size:1.8rem;font-weight:bold;}
  .value.win{color:var(--win);}
  .value.lose{color:var(--lose);}
  .value.draw{color:var(--draw);}

  .battle{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:40px;
    margin:10px 0 30px;
    flex-wrap:wrap;
  }
  .player-slot{
    text-align:center;
  }
  .player-slot .name{
    font-size:1.1rem;
    margin-bottom:8px;
    font-weight:bold;
  }
  .hand-display{
    width:140px;
    height:140px;
    background:var(--card);
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:4.5rem;
    box-shadow:0 6px 16px rgba(0,0,0,0.12);
    transition:transform 0.25s ease;
  }
  .hand-display.shake{
    animation:shake 0.5s ease infinite;
  }
  @keyframes shake{
    0%,100%{transform:rotate(0deg);}
    25%{transform:rotate(-8deg);}
    75%{transform:rotate(8deg);}
  }
  .vs{
    font-size:2rem;
    font-weight:bold;
    color:var(--accent-dark);
  }

  .result-message{
    font-size:1.6rem;
    font-weight:bold;
    min-height:2.4rem;
    margin-bottom:20px;
    text-align:center;
  }
  .result-message.win{color:var(--win);}
  .result-message.lose{color:var(--lose);}
  .result-message.draw{color:var(--draw);}

  .choices{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .choice-btn{
    width:110px;
    height:110px;
    border-radius:50%;
    border:none;
    background:var(--card);
    font-size:3rem;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,0.12);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .choice-btn:hover{
    transform:translateY(-6px) scale(1.05);
    box-shadow:0 10px 20px rgba(0,0,0,0.18);
  }
  .choice-btn:active{
    transform:scale(0.95);
  }
  .choice-btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
    transform:none;
  }

  .controls{
    margin-top:30px;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    padding:12px 26px;
    border-radius:14px;
    border:none;
    font-size:1.05rem;
    font-weight:bold;
    cursor:pointer;
    background:var(--accent);
    color:white;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    transition:background 0.2s ease, transform 0.15s ease;
  }
  .btn:hover{background:var(--accent-dark); transform:translateY(-2px);}
  .btn.secondary{
    background:white;
    color:var(--accent-dark);
    border:2px solid var(--accent);
  }

  .mode-select{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .mode-btn{
    padding:8px 18px;
    border-radius:20px;
    border:2px solid var(--accent);
    background:white;
    color:var(--accent-dark);
    font-weight:bold;
    cursor:pointer;
    font-size:0.95rem;
  }
  .mode-btn.active{
    background:var(--accent);
    color:white;
  }

  footer{
    margin-top:40px;
    font-size:0.85rem;
    color:#999;
    text-align:center;
  }

  @media (max-width:480px){
    .hand-display{width:100px;height:100px;font-size:3.2rem;}
    .choice-btn{width:88px;height:88px;font-size:2.4rem;}
    h1{font-size:1.8rem;}
  }
</style>
</head>
<body>

<h1>✊✋✌️ 가위바위보 게임</h1>
<div class="subtitle">컴퓨터와 가위바위보를 해보아요!</div>

<div class="mode-select">
  <button class="mode-btn active" data-round="1">한 판 승부</button>
  <button class="mode-btn" data-round="3">3판 2승</button>
  <button class="mode-btn" data-round="5">5판 3승</button>
</div>

<div class="scoreboard">
  <div class="score-box">
    <div class="label">나 (승)</div>
    <div class="value win" id="winCount">0</div>
  </div>
  <div class="score-box">
    <div class="label">비김</div>
    <div class="value draw" id="drawCount">0</div>
  </div>
  <div class="score-box">
    <div class="label">컴퓨터 (승)</div>
    <div class="value lose" id="loseCount">0</div>
  </div>
</div>

<div class="battle">
  <div class="player-slot">
    <div class="name">나</div>
    <div class="hand-display" id="playerHand">❓</div>
  </div>
  <div class="vs">VS</div>
  <div class="player-slot">
    <div class="name">컴퓨터</div>
    <div class="hand-display" id="computerHand">❓</div>
  </div>
</div>

<div class="result-message" id="resultMessage">가위, 바위, 보 중 하나를 골라보세요!</div>

<div class="choices">
  <button class="choice-btn" data-choice="rock" title="바위">✊</button>
  <button class="choice-btn" data-choice="scissors" title="가위">✌️</button>
  <button class="choice-btn" data-choice="paper" title="보">✋</button>
</div>

<div class="controls">
  <button class="btn secondary" id="resetBtn">점수 초기화</button>
</div>

<footer>초등학교 수업용 가위바위보 게임</footer>

<script>
  const emojis = { rock:'✊', paper:'✋', scissors:'✌️' };
  const names = { rock:'바위', paper:'보', scissors:'가위' };

  const playerHandEl = document.getElementById('playerHand');
  const computerHandEl = document.getElementById('computerHand');
  const resultEl = document.getElementById('resultMessage');
  const winCountEl = document.getElementById('winCount');
  const drawCountEl = document.getElementById('drawCount');
  const loseCountEl = document.getElementById('loseCount');
  const choiceBtns = document.querySelectorAll('.choice-btn');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtns = document.querySelectorAll('.mode-btn');

  let wins = 0, draws = 0, losses = 0;
  let targetRounds = 1; // best-of N single round by default
  let seriesActive = true;

  function pickComputer(){
    const opts = ['rock','paper','scissors'];
    return opts[Math.floor(Math.random()*3)];
  }

  function judge(player, computer){
    if(player === computer) return 'draw';
    const winsAgainst = { rock:'scissors', scissors:'paper', paper:'rock' };
    return winsAgainst[player] === computer ? 'win' : 'lose';
  }

  function neededWins(){
    return Math.ceil(targetRounds/2);
  }

  function checkSeriesEnd(){
    const need = neededWins();
    if(targetRounds === 1) return true; // always ends after one round in single mode display, but score keeps accumulating
    if(wins >= need){
      resultEl.textContent = `🎉 최종 승리! 나의 승! (${wins}:${losses})`;
      resultEl.className = 'result-message win';
      seriesActive = false;
      return false;
    }
    if(losses >= need){
      resultEl.textContent = `😢 최종 패배! 컴퓨터 승! (${wins}:${losses})`;
      resultEl.className = 'result-message lose';
      seriesActive = false;
      return false;
    }
    return true;
  }

  function play(playerChoice){
    if(!seriesActive) return;

    choiceBtns.forEach(b => b.disabled = true);
    playerHandEl.classList.add('shake');
    computerHandEl.classList.add('shake');
    playerHandEl.textContent = '🤜';
    computerHandEl.textContent = '🤛';
    resultEl.textContent = '가위바위보!';
    resultEl.className = 'result-message';

    setTimeout(() => {
      const computerChoice = pickComputer();
      playerHandEl.classList.remove('shake');
      computerHandEl.classList.remove('shake');
      playerHandEl.textContent = emojis[playerChoice];
      computerHandEl.textContent = emojis[computerChoice];

      const outcome = judge(playerChoice, computerChoice);

      if(outcome === 'win'){
        wins++;
        resultEl.textContent = `이겼어요! 🎉 (${names[playerChoice]} vs ${names[computerChoice]})`;
        resultEl.className = 'result-message win';
      } else if(outcome === 'lose'){
        losses++;
        resultEl.textContent = `졌어요 😢 (${names[playerChoice]} vs ${names[computerChoice]})`;
        resultEl.className = 'result-message lose';
      } else {
        draws++;
        resultEl.textContent = `비겼어요! 🤝 (${names[playerChoice]} vs ${names[computerChoice]})`;
        resultEl.className = 'result-message draw';
      }

      winCountEl.textContent = wins;
      drawCountEl.textContent = draws;
      loseCountEl.textContent = losses;

      const stillGoing = checkSeriesEnd();
      if(stillGoing){
        choiceBtns.forEach(b => b.disabled = false);
      }
    }, 600);
  }

  choiceBtns.forEach(btn => {
    btn.addEventListener('click', () => play(btn.dataset.choice));
  });

  resetBtn.addEventListener('click', () => {
    wins = 0; draws = 0; losses = 0;
    winCountEl.textContent = 0;
    drawCountEl.textContent = 0;
    loseCountEl.textContent = 0;
    playerHandEl.textContent = '❓';
    computerHandEl.textContent = '❓';
    resultEl.textContent = '가위, 바위, 보 중 하나를 골라보세요!';
    resultEl.className = 'result-message';
    seriesActive = true;
    choiceBtns.forEach(b => b.disabled = false);
  });

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      targetRounds = parseInt(btn.dataset.round, 10);
      resetBtn.click();
    });
  });
</script>

</body>
</html>
